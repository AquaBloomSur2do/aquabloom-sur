name: CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  web-ci:
    name: Validar Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Instalar dependencias
        run: pnpm install
      - name: Ejecutar Linter
        run: pnpm run lint
      - name: Compilar
        run: pnpm run build

  api-ci:
    name: Validar API
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install -r apps/api/requirements.txt
          pip install pytest ruff
      - name: Ejecutar Linter
        run: ruff check apps/api/
      - name: Ejecutar pruebas
        run: pytest apps/api/tests/ -v

  satellite-ci:
    name: Validar servicio Satellite
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias y herramientas
        run: |
          pip install -r apps/satellite/requirements.txt
          pip install httpx pytest ruff
      - name: Ejecutar linter
        run: ruff check apps/satellite/
      - name: Ejecutar pruebas
        run: pytest apps/satellite/tests/ -v

