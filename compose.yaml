version: '3.8'

services:
  # 1. API Gateway (Punto de entrada único)
  gateway:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./apps/api/.env
    ports:
      - "5000:8000" # Expuesto al host en el 5000 para el frontend local
    networks:
      - aquabloom-net
    depends_on:
      - core
      - satellite
      - scientific

  # 2. Core Service (Catálogo, Identidad, Dataset, Ingesta)
  core:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    # Se levanta en un puerto interno diferente al gateway
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    env_file:
      - ./apps/api/.env
    # No se exponen puertos al host, solo es accesible internamente vía Gateway
    networks:
      - aquabloom-net

  # 3. Satellite Service (Procesamiento Raster y Sentinel-2)
  satellite:
    build:
      # Asume que el Dockerfile de satellite existirá aquí
      context: ./apps/satellite
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    env_file:
      - ./apps/satellite/.env
    networks:
      - aquabloom-net

  # 4. Scientific Service (ML, Entrenamiento, Inferencia)
  scientific:
    build:
      # Asume que se creará la carpeta apps/scientific pronto
      context: ./apps/scientific
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003
    env_file:
      - ./apps/scientific/.env
    networks:
      - aquabloom-net

  # 5. Frontend React (App Web)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/web/.env
    ports:
      - "3000:5173"
    networks:
      - aquabloom-net
    depends_on:
      - gateway

  # NOTA: La infraestructura de Redis (Broker) y el Celery Worker
  # se agregarán aquí durante la fase de integración asíncrona del Scientific Service.

networks:
  aquabloom-net:
    driver: bridge