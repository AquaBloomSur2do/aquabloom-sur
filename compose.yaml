services:
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    ports:
      - "5000:8000"
    networks:
      - aquabloom-net

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    env_file:
      - ./apps/web/.env
    ports:
      - "3000:5173"
    networks:
      - aquabloom-net
    depends_on:
      - api

networks:
  aquabloom-net:
    driver: bridge

