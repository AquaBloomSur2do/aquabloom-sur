services:
  # 0. Redis (Cola de mensajería para Satellite y workers)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - aquabloom-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 1. API Gateway (Punto de entrada único)
  gateway:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: ./apps/api/.env.example
        required: false
      - path: ./apps/api/.env
        required: false
    ports:
      - "5000:8000"
    networks:
      - aquabloom-net
    depends_on:
      core:
        condition: service_healthy
      satellite:
        condition: service_healthy
      scientific:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Core Service (Catálogo, Identidad, Dataset, Ingesta)
  core:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8001
    env_file:
      - path: ./apps/api/.env.example
        required: false
      - path: ./apps/api/.env
        required: false
    ports:
      - "8001:8001"
    networks:
      - aquabloom-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Satellite Service (Procesamiento Raster y Sentinel-2 — Despliegue Independiente)
  satellite:
    build:
      context: ./apps/satellite
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn apps.satellite.app.main:app --host 0.0.0.0 --port 8002
    env_file:
      - path: ./apps/satellite/.env.example
        required: true
      - path: ./apps/satellite/.env
        required: false
    environment:
      SATELLITE_REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8002"
    networks:
      - aquabloom-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Scientific Service (ML, Entrenamiento, Inferencia — Despliegue Independiente)
  scientific:
    build:
      context: ./apps/scientific
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn apps.scientific.app.main:app --host 0.0.0.0 --port 8003
    env_file:
      - path: ./apps/scientific/.env.example
        required: true
      - path: ./apps/scientific/.env
        required: false
    ports:
      - "8003:8003"
    networks:
      - aquabloom-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Frontend React (App Web)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./apps/web/.env.example
        required: false
      - path: ./apps/web/.env
        required: false
    ports:
      - "3000:5173"
    networks:
      - aquabloom-net
    depends_on:
      gateway:
        condition: service_healthy

networks:
  aquabloom-net:
    driver: bridge



