services:
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    ports:
      - "5000:8000"
    networks:
      - aquabloom-net

  satellite:
    build:
      context: ./apps/satellite
    restart: unless-stopped
    environment:
      SATELLITE_SERVICE_NAME: ${SATELLITE_SERVICE_NAME:-AquaBloom Satellite}
      SATELLITE_ENVIRONMENT: ${SATELLITE_ENVIRONMENT:-development}
    ports:
      - "${SATELLITE_PORT:-8001}:8000"
    networks:
      - aquabloom-net

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    env_file:
      - ./apps/web/.env
    ports:
      - "3000:5173"
    networks:
      - aquabloom-net
    depends_on:
      - api

networks:
  aquabloom-net:
    driver: bridge
